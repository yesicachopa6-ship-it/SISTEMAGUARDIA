<!DOCTYPE html>
<html>
<head>
    <title>GNA - Login</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f2f5;
            position: relative;
        }

    /* Fondo que cubre TODA la pantalla */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('/static/fondo.png');
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover; /* Aquí es donde cubre todo */
            opacity: 0.1; /* Transparencia ideal para no molestar la vista */
            z-index: -1;
        }

    /* La ventana central */
        .ventana-llamativa {
            background: rgba(255, 255, 255, 0.95); /* Blanco casi sólido */
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 450px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

    /* Encabezado con logos */
        .header-form {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            border-bottom: 2px solid #2e4d23;
            padding-bottom: 15px;
        }

        .logo-gna {
            width: 50px;
            height: auto;
        }

    /* Campos de texto y botones */
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
            color: #1a3a5a;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .btn-principal {
            width: 100%;
            background: linear-gradient(135deg, #2e4d23 0%, #1a3a5a 100%);
            color: white;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 25px;
            transition: 0.3s ease;
        }   

        .btn-principal:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <div class="ventana-llamativa">
        <div class="header-form">
            <!-- Si tienes el logo en static, se verá aquí -->
             <img src="{{ url_for('static', filename='logo_gna.png') }}" 
            class="logo-gna" alt="GNA">
            <h2 style="color: #2e4d23; margin: 0;">SISTEMA DE GUARDIA</h2>
        </div>

        <form method="POST">
            <label>Usuario</label>
            <input type="text" name="username" required placeholder="Ingrese su usuario">
            
            <label>Contraseña</label>
            <input type="password" name="password" required placeholder="Ingrese su contraseña">
            
            <button type="submit" class="btn-principal">INGRESAR AL SISTEMA</button>
        </form>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <p style="color: red; text-align: center; margin-top: 15px; font-weight: bold;">
                {{ message }}
              </p>
            {% endfor %}
          {% endif %}
        {% endwith %}
    </div>
</body>
</html>
